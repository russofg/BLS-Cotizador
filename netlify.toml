[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # All <script> blocks in .astro files are bundled by Astro/Vite into external .js files.
    # @vite-pwa/astro resolves injectRegister to "script" (external registerSW.js) because
    # useImportRegister=false with Astro. No inline scripts exist in this app.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://dolarapi.com wss://*.firebaseio.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

# Force HTTPS on all requests
[[redirects]]
  from = "http://bls-cotizador.netlify.app/*"
  to = "https://bls-cotizador.netlify.app/:splat"
  status = 301
  force = true

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfmake"]

[functions."process-reminders"]
  schedule = "0 * * * *"

[dev]
  command = "npm run dev"
  port = 4321
  targetPort = 4321
